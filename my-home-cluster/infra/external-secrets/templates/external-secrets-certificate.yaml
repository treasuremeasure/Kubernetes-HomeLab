{{- if .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "external-secrets.fullname" . }}-webhook
  namespace: {{ template "external-secrets.namespace" . }}
spec:
  secretName: {{ .Values.webhook.secretName | default "external-secrets-webhook-tls" }}
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - {{ include "external-secrets.fullname" . }}-webhook.{{ template "external-secrets.namespace" . }}.svc
    - {{ include "external-secrets.fullname" . }}-webhook.{{ template "external-secrets.namespace" . }}.svc.cluster.local
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
{{- end }}
